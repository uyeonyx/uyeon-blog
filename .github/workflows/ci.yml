# lint + typecheck + 스키마 드리프트 검사, 그리고 DB 대조(마이그레이션 적용 상태).
# build는 프리렌더가 live DB(DATABASE_URL)를 읽어야 해서 CI에서 돌리지 않는다 —
# 실제 빌드 검증은 Vercel 배포 파이프라인이 담당한다. CI에서 빌드가 필요해지면
# 읽기 전용 DB 계정의 DATABASE_URL 시크릿을 추가하고 build 잡을 붙일 것.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 미적용 마이그레이션이 남아 있으면 매일 한 번 다시 알린다 —
  # 푸시 때 한 번 놓치면 그대로 잊히는 것을 막는 장치.
  schedule:
    - cron: '0 0 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare-assets # lib/generated/icon-bundle.ts 재생성 (typecheck 의존)
      - run: pnpm lint:ci
      - run: pnpm typecheck

      # schema.ts만 고치고 마이그레이션 생성을 잊는 것을 잡는다.
      # generate는 DB에 접속하지 않으므로 시크릿이 필요 없다.
      # stdin을 닫아 rename 확인 프롬프트가 뜨면 매달리지 않고 실패하게 한다.
      - name: 스키마 드리프트 검사
        timeout-minutes: 3
        run: |
          pnpm db:generate < /dev/null
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::lib/db/schema.ts 변경에 대응하는 마이그레이션이 없습니다. 'pnpm db:generate'를 돌리고 drizzle/ 변경분을 함께 커밋하세요."
            git status --porcelain drizzle/
            git --no-pager diff -- drizzle/
            exit 1
          fi

  # 배포된 스키마와 저장소의 마이그레이션이 어긋나 있는지 본다.
  # PR에서는 돌리지 않는다 — 아직 적용되지 않은 게 정상이고, 포크 PR은 시크릿에 접근할 수 없다.
  # DATABASE_URL 시크릿이 없으면 스크립트가 스스로 건너뛴다.
  migrations:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 미적용 마이그레이션 검사
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-migrations.mjs
